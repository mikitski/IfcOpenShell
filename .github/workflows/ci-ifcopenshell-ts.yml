name: ci-ifcopenshell-ts

on:
  push:
    paths:
      - 'src/ifcopenshell-ts/**'
      - 'src/ifcparse/**'
      - 'src/plugin/**'
      - 'cmake/**'
      - '.github/workflows/ci-ifcopenshell-ts.yml'
  pull_request:

jobs:
  activate:
    runs-on: ubuntu-22.04
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - run: echo ok go

  build-and-test:
    needs: activate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native-addon build matrix, matching the existing C++ core CI
          # matrix (build_osx.yml, build_win.yml, build_rocky_arm.yml):
          # 3 OSes x 2 architectures each.
          - os: linux
            arch: x64
            runner: ubuntu-22.04
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
          - os: macos
            arch: x64
            runner: macos-13
          - os: macos
            arch: arm64
            runner: macos-14
          - os: windows
            arch: x64
            runner: windows-2022
            vsArch: x64
            vcpkgTriplet: x64-windows
          - os: windows
            arch: arm64
            runner: windows-11-arm
            vsArch: ARM64
            vcpkgTriplet: arm64-windows
    runs-on: ${{ matrix.runner }}
    env:
      CLICOLOR_FORCE: "1"
      CMAKE_COLOR_DIAGNOSTICS: "ON"
      INSTALL_PREFIX: ${{ github.workspace }}/install
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake \
            libboost-date-time-dev \
            libboost-iostreams-dev \
            libboost-program-options-dev \
            libboost-regex-dev \
            libboost-thread-dev \
            libeigen3-dev

      - name: Install build dependencies (macOS)
        if: matrix.os == 'macos'
        run: |
          brew install boost eigen
          echo "CMAKE_PREFIX_PATH=$(brew --prefix)" >> "$GITHUB_ENV"

      - name: Install build dependencies (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install `
            boost-program-options boost-regex boost-thread boost-date-time boost-iostreams eigen3 `
            --triplet ${{ matrix.vcpkgTriplet }}

      - name: ccache
        if: matrix.os != 'windows'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ifcopenshell-ts-${{ matrix.os }}-${{ matrix.arch }}

      # Build and install just enough of the C++ core for the addon to link
      # against: BUILD_IFCGEOM=OFF skips OpenCASCADE/CGAL entirely, since the
      # Phase 0 smoke test only needs ifcparse (open a file, read its schema).
      # A single schema version keeps this fast - Phase 0 has no schema-
      # specific porting work yet.
      - name: Configure and install IfcOpenShell core (Unix)
        if: matrix.os != 'windows'
        run: |
          cmake -S cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$INSTALL_PREFIX" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DSCHEMA_VERSIONS=4 \
            -DBUILD_IFCGEOM=OFF \
            -DBUILD_IFCPYTHON=OFF \
            -DBUILD_CONVERT=OFF \
            -DBUILD_GEOMSERVER=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DWITH_CGAL=OFF \
            -DCOLLADA_SUPPORT=OFF
          cmake --build build --target install --parallel

      - name: Configure and install IfcOpenShell core (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          cmake -S cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.vsArch }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkgTriplet }} `
            -DCMAKE_INSTALL_PREFIX="$env:INSTALL_PREFIX" `
            -DCMAKE_INSTALL_LIBDIR=lib `
            -DSCHEMA_VERSIONS=4 `
            -DBUILD_IFCGEOM=OFF `
            -DBUILD_IFCPYTHON=OFF `
            -DBUILD_CONVERT=OFF `
            -DBUILD_GEOMSERVER=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DWITH_CGAL=OFF `
            -DCOLLADA_SUPPORT=OFF 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::group::configure failure (last 80 lines)"
            Get-Content configure.log -Tail 80 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output "::endgroup::"
            exit $LASTEXITCODE
          }
          cmake --build build --config Release --target install --parallel 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::group::build failure (last 80 lines)"
            Get-Content build.log -Tail 80 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output "::endgroup::"
            exit $LASTEXITCODE
          }

      - name: npm ci
        working-directory: src/ifcopenshell-ts
        run: npm ci

      - name: Build native addon (Unix)
        if: matrix.os != 'windows'
        working-directory: src/ifcopenshell-ts
        run: |
          set -o pipefail
          npm run build:native -- --CDCMAKE_PREFIX_PATH="$INSTALL_PREFIX" 2>&1 | tee /tmp/build-native.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "::group::build:native failure (last 80 lines)"
            tail -n 80 /tmp/build-native.log | while IFS= read -r line; do echo "::error::$line"; done
            echo "::endgroup::"
            exit $status
          fi

      - name: Build native addon (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        working-directory: src/ifcopenshell-ts
        run: |
          npm run build:native -- `
            --CDCMAKE_PREFIX_PATH="$env:INSTALL_PREFIX" `
            --CDCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            --CDVCPKG_TARGET_TRIPLET=${{ matrix.vcpkgTriplet }} 2>&1 | Tee-Object -FilePath build-native.log
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::group::build:native failure (last 80 lines)"
            Get-Content build-native.log -Tail 80 | ForEach-Object { Write-Output "::error::$_" }
            Write-Output "::endgroup::"
            exit $LASTEXITCODE
          }

      - name: Build TS
        working-directory: src/ifcopenshell-ts
        run: npm run build:ts

      # The addon dynamically links against IfcParse (and, at runtime,
      # dlopen()s the schema plugin installed alongside it), so the install
      # tree's library directory needs to be on the platform's shared-library
      # search path for `npm test` to load it.
      - name: Add installed libraries to the runtime search path (Linux)
        if: matrix.os == 'linux'
        run: echo "LD_LIBRARY_PATH=$INSTALL_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Add installed libraries to the runtime search path (macOS)
        if: matrix.os == 'macos'
        run: echo "DYLD_LIBRARY_PATH=$INSTALL_PREFIX/lib" >> "$GITHUB_ENV"

      - name: Add installed libraries to the runtime search path (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          "$env:INSTALL_PREFIX\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: npm test
        working-directory: src/ifcopenshell-ts
        run: npm test
